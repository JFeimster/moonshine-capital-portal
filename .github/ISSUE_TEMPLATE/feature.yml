name: Feature / improvement
description: Propose a focused product, infrastructure, or operational improvement
title: "[Feature] "
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What useful outcome should this create?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why this matters
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Focused scope
      description: Concrete routes, files, systems, or behaviors in scope.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true to close this issue?
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Architecture / boundaries
      description: Note source-of-truth, security, lifecycle, or explicit out-of-scope constraints where relevant.
